version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"
    labels:
      - "tools"
    groups:
      go-dependencies:
        patterns:
          - "*"
    ignore:
      # go-msix v1.0.0 has a breaking API change incompatible with the
      # nfpm v2.47.0 in use by goreleaser; held at v0.3.1 until that's resolved.
      - dependency-name: "go.digitalxero.dev/go-msix"
        versions: [">= 1.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "github_actions"
    groups:
      gha-dependencies:
        patterns:
          - "*"
