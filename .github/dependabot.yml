version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "github.com/fastly/go-fastly/*"
    allow:
      - dependency-type: "all"
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "all"
    labels:
      - "tools"
    groups:
      go-dependencies:
        patterns:
          - "*"
    ignore:
      # goreleaser/fileglob still imports github.com/gobwas/glob/syntax/{ast,lexer},
      # which were removed in glob v1.x, so the module can't be resolved at >= 1.0.0.
      # Drop this once fileglob supports glob v1.
      - dependency-name: "github.com/gobwas/glob"
        versions: [">= 1.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "github_actions"
    groups:
      gha-dependencies:
        patterns:
          - "*"
